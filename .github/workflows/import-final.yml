
name: RuMaZ RC5 veilige bronimport

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-rc5:
    if: github.ref == 'refs/heads/release/rumaz-3.0-rc5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout releasebranch
        uses: actions/checkout@v4

      - name: Controleer en pak RC5 uit
        shell: bash
        run: |
          set -euo pipefail
          archive='Rumaz-RC5-integratiecheck-en-voorbereiding.zip'
          test -f "$archive"
          unzip -tq "$archive"
          unzip -oq "$archive" -x '.github/workflows/*'
          test -f START-HIER.md
          test -f site/index.html
          test -f netlify.toml
          test -f package.json
          test -f backend/completion.sql

      - name: Commit uitsluitend op releasebranch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RuMaZ RC5 import'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import RuMaZ RC5 bestaande broncode'
          git push origin HEAD:refs/heads/release/rumaz-3.0-rc5
