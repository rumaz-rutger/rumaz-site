          test "$GITHUB_REF" = 'refs/heads/feat/rumaz-home-3-2'
          test "$(git rev-parse HEAD^)" = '37f1b485bada165ca652cf028ebd34c081db6819'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/import-rumaz32-ux-seo.yml'
