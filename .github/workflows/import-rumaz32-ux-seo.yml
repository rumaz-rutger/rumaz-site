      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing dependencies without changing lockfile
        run: npm ci
      - name: Run 76 regression tests, static checks and one local staging build
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/rumaz32-ux-tests.log
          grep -Eq '(#|ℹ)[[:space:]]+pass[[:space:]]+76([[:space:]]|$)' /tmp/rumaz32-ux-tests.log
          grep -Eq '(#|ℹ)[[:space:]]+fail[[:space:]]+0([[:space:]]|$)' /tmp/rumaz32-ux-tests.log
          python3 qa/check-static.py 2>&1 | tee /tmp/rumaz32-ux-static.log
          npm run build
          test -f dist/index.html
          test -f dist/start-plek/index.html
          test -f dist/robots.txt
          grep -Fq 'Disallow: /' dist/robots.txt
          grep -Fq 'noindex,nofollow' dist/start-plek/index.html
          grep -Fq 'Zoek mijn plek' dist/assets/js/rumaz3-onboarding.js
          grep -Fq 'https://rumaz.nl/' dist/index.html
          git diff --check
          git diff --name-only > /tmp/rumaz32-actual-files.txt
          diff -u /tmp/rumaz32-expected-files.txt /tmp/rumaz32-actual-files.txt
      - name: Commit only 5 approved changes and trigger the existing staging site once
        shell: bash
        run: |
          set -euo pipefail
          # Self-remove this one-shot import workflow; only the 5 approved files remain.
          git rm .github/workflows/import-rumaz32-ux-seo.yml
          git add -- qa/start-onboarding.test.mjs site/index.html site/assets/css/rumaz3-onboarding.css site/assets/js/rumaz3-onboarding.js site/assets/js/rumaz3-start-draft.js
          git diff --cached --check
          # No unrelated modifications may sneak into the commit.
          cat >/tmp/rumaz32-expected-commit.txt <<'COMMIT_FILES'
          .github/workflows/import-rumaz32-ux-seo.yml
          qa/start-onboarding.test.mjs
          site/assets/css/rumaz3-onboarding.css
          site/assets/js/rumaz3-onboarding.js
          site/assets/js/rumaz3-start-draft.js
          site/index.html
          COMMIT_FILES
          git diff --cached --name-only > /tmp/rumaz32-actual-commit.txt
          diff -u /tmp/rumaz32-expected-commit.txt /tmp/rumaz32-actual-commit.txt
          git config user.name 'Rumaz 3.2 staging importer'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Rumaz 3.2: onboarding UX en homepage SEO (staging)'
          git push origin HEAD:refs/heads/feat/rumaz-home-3-2
