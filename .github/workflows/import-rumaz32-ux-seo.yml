name: Rumaz 3.2 - UX en SEO veilig importeren (staging)

on:
  push:
    branches:
      - feat/rumaz-home-3-2
    paths:
      - .github/workflows/import-rumaz32-ux-seo.yml

permissions:
  contents: write

concurrency:
  group: rumaz-3-2-ux-seo-one-shot-import
  cancel-in-progress: false

jobs:
  verified-ux-seo-import:
    if: github.repository == 'rumaz-rutger/rumaz-site' && github.ref == 'refs/heads/feat/rumaz-home-3-2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUMAZ_ENV: staging
      RUMAZ_SITE_ORIGIN: https://rumaz-staging.netlify.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact 5-file patch from approved ZIP
