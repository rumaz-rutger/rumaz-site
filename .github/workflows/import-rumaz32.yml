name: Rumaz 3.2 - eenmalige import uit goedgekeurd pakket

on:
  push:
    branches:
      - feat/rumaz-home-3-2
    paths:
      - .github/workflows/import-rumaz32.yml

permissions:
  contents: write

concurrency:
  group: rumaz32-approved-import
  cancel-in-progress: false

jobs:
  import-approved-package:
    if: github.repository == 'rumaz-rutger/rumaz-site' && github.ref == 'refs/heads/feat/rumaz-home-3-2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUMAZ_ENV: staging
      RUMAZ_SITE_ORIGIN: https://rumaz-staging.netlify.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bescherm main en controleer exacte pakketbasis
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/rumaz-home-3-2'
          test "$(git branch --show-current)" = 'feat/rumaz-home-3-2'
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = 'a171cecf2c4b0bbc6c9967ae80510c205b8a8530'
          git merge-base --is-ancestor 'a171cecf2c4b0bbc6c9967ae80510c205b8a8530' HEAD
          test "$(git rev-list --count 'a171cecf2c4b0bbc6c9967ae80510c205b8a8530'..HEAD)" = '1'
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only 'a171cecf2c4b0bbc6c9967ae80510c205b8a8530' HEAD)" = '.github/workflows/import-rumaz32.yml'
      - name: Herstel geverifieerde patch uit enige Rumaz 3.2 ZIP
