      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test bestaande website zonder productiesystemen
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          python3 qa/check-static.py
          npm run build
          test -f dist/index.html
          test -f dist/start-plek/index.html
          grep -Fq '/start-plek/?pleksoort=woning' dist/index.html
          grep -Fq '/start-plek/?pleksoort=boot' dist/index.html
          grep -Fq 'noindex' dist/_headers
          grep -Fq 'Disallow: /' dist/robots.txt
