name: Rumaz 3.2 - hotfix app Home naar onboarding

on:
  push:
    branches:
      - feat/rumaz-home-3-2
    paths:
      - .github/workflows/import-rumaz32-home-navigatie.yml

permissions:
  contents: write

concurrency:
  group: rumaz32-home-navigatie-hotfix
  cancel-in-progress: false

jobs:
  app-home-hotfix:
    if: github.repository == 'rumaz-rutger/rumaz-site' && github.ref == 'refs/heads/feat/rumaz-home-3-2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUMAZ_ENV: staging
      RUMAZ_SITE_ORIGIN: https://rumaz-staging.netlify.app
    steps:
      - name: Checkout actuele 3.2-branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifieer exacte bron en behoud main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feat/rumaz-home-3-2'
          test "$(git rev-parse HEAD^)" = '5b55815b17215943d4bf007a47857006cfe44d19'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/import-rumaz32-home-navigatie.yml'
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = 'baf763ee2e868152cfc44e54369951713137c4fc'
          test "$(git rev-parse HEAD:site/app/index.html)" = '312fbf8447ecda50e21dfd871c9e83dfa8318646'
          test "$(git rev-parse HEAD:site/assets/js/rumaz3-social.js)" = 'e8304b7140c24e52c8ac1f92bd073a119bd56281'
          git diff --quiet origin/main -- site/app/index.html site/assets/js/rumaz3-social.js
          test -f site/start-plek/index.html
          echo 'Alle preflight-controles geslaagd.'

      - name: Herstel alleen zes Home-links en oude klikonderschepping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('site/app/index.html')
          script_path = Path('site/assets/js/rumaz3-social.js')
          html = html_path.read_text(encoding='utf-8')
          script = script_path.read_text(encoding='utf-8')
          types = ('woning', 'appartement', 'huisje', 'camper', 'caravan', 'boot')
          for kind in types:
              old = f'data-place-intent="{kind}" href="/app/account/registreren/?pleksoort={kind}"'
              new = f'data-place-intent="{kind}" href="/start-plek/?pleksoort={kind}"'
              assert html.count(old) == 1, f'Verwachte oude link niet exact 1x gevonden: {kind}'
              html = html.replace(old, new)
          old_handler = "document.querySelectorAll('[data-place-intent]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();startPlace(a.dataset.placeIntent)}));"
          assert script.count(old_handler) == 1, 'Oude klikhandler ontbreekt of is veranderd'
          # Native browserlinks zijn betrouwbaarder dan een tweede JavaScript-redirect.
          script = script.replace(old_handler, '// Home-kaarten gebruiken hun eigen /start-plek/-link; geen JavaScript-omleiding.')
          html_path.write_text(html, encoding='utf-8')
          script_path.write_text(script, encoding='utf-8')
          print('Hotfix toegepast: 6 links plus 1 oude klikhandler verwijderd.')
          PY

      - name: Controleer alle zes routes en behouden accountflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('site/app/index.html').read_text(encoding='utf-8')
          home = Path('site/index.html').read_text(encoding='utf-8')
          script = Path('site/assets/js/rumaz3-social.js').read_text(encoding='utf-8')
          for kind in ('woning','appartement','huisje','camper','caravan','boot'):
              expected = f'data-place-intent="{kind}" href="/start-plek/?pleksoort={kind}"'
              assert app.count(expected) == 1, f'App-Home {kind} is onjuist'
              assert home.count(expected) == 1, f'Publieke Home {kind} is onjuist'
          assert 'href="/app/account/registreren/?pleksoort=' not in app
          assert "a.addEventListener('click',e=>{e.preventDefault();startPlace(a.dataset.placeIntent)})" not in script
          assert "if(pendingType)startPlace(pendingType);" in script, 'Bestaande account-deep-link gewijzigd'
          assert "if(live&&!remote.user){login();return;}" in script or "if(live&&['plek','plekken','berichten'].includes(tab)&&!remote.user){login();return;}" in script
          assert 'noindex,nofollow' in Path('site/start-plek/index.html').read_text(encoding='utf-8')
          print('12 Home-links juist; login-, deep-link- en noindex-routes behouden.')
          PY
          test "$(git diff --name-only | sort)" = "$(printf 'site/app/index.html\nsite/assets/js/rumaz3-social.js' | sort)"

      - name: Gebruik bestaande Node-versie en afhankelijkheden
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regressietests en een lokale stagingbuild
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build
          test -f dist/robots.txt
          grep -Fqx 'Disallow: /' dist/robots.txt
          test -f dist/start-plek/index.html
          test -f dist/app/index.html
          echo 'Regressietests en lokale stagingbuild geslaagd.'

      - name: Commit alleen 2 hotfixbestanden en verwijder importworkflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/app/index.html site/assets/js/rumaz3-social.js
          git rm -- .github/workflows/import-rumaz32-home-navigatie.yml
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '.github/workflows/import-rumaz32-home-navigatie.yml\nsite/app/index.html\nsite/assets/js/rumaz3-social.js' | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse origin/main)" = 'baf763ee2e868152cfc44e54369951713137c4fc'
          git commit -m 'Rumaz 3.2 hotfix: app Home naar Mijn plek onboarding'
          git push origin HEAD:refs/heads/feat/rumaz-home-3-2
          echo 'Hotfix op featurebranch; bestaande staging mag één keer bouwen. Geen main-write.'
