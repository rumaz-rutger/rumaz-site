name: Rumaz 3.2 - herkenning herstelpatch veilig importeren

on:
  push:
    branches:
      - feat/rumaz-home-3-2
    paths:
      - .github/workflows/import-rumaz32-herstel.yml

permissions:
  contents: write

concurrency:
  group: rumaz-3-2-herstel-eenmalig
  cancel-in-progress: false

jobs:
  patch-test-import:
    if: github.repository == 'rumaz-rutger/rumaz-site' && github.ref == 'refs/heads/feat/rumaz-home-3-2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUMAZ_ENV: staging
      RUMAZ_SITE_ORIGIN: https://rumaz-staging.netlify.app
      BASE_COMMIT: '2c44e58713613d5ca541c02f896b1fec0c4a2803'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Controleer branch, pakketbasis en ongewijzigde productie
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/rumaz-home-3-2'
          test "$(git branch --show-current)" = 'feat/rumaz-home-3-2'
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          test -z "$(git status --porcelain)"
          test -f '.github/workflows/import-rumaz32-herstel.yml'
          echo 'Pakketbasis is ancestor; nieuwere wijzigingen worden niet weggegooid.'
