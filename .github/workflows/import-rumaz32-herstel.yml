      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Automatische regressietests, lokale links en stagingbuild
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          python3 qa/check-static.py
          npm run build
          test -f dist/index.html
          test -f dist/start-plek/index.html
          grep -Fq 'Disallow: /' dist/robots.txt
          test "$(git diff --name-only -- netlify/functions/place-lookup.mjs qa/place-lookup.test.mjs qa/start-onboarding.test.mjs server/place-lookup.mjs site/assets/js/rumaz3-onboarding.js | wc -l)" -eq 5
      - name: Commit uitsluitend herstelbestanden en verwijder tijdelijke importworkflow
        shell: bash
        run: |
          set -euo pipefail
          git rm '.github/workflows/import-rumaz32-herstel.yml'
          git add "netlify/functions/place-lookup.mjs" "qa/place-lookup.test.mjs" "qa/start-onboarding.test.mjs" "server/place-lookup.mjs" "site/assets/js/rumaz3-onboarding.js"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git config user.name 'Rumaz staging patch importer'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Rumaz 3.2: BAG, RDW en website-herkenning herstel (staging)'
          git diff --name-only "$BASE_COMMIT" HEAD | diff -u /tmp/expected-files -
          git fetch origin feat/rumaz-home-3-2
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD^)"
          git push origin HEAD:refs/heads/feat/rumaz-home-3-2
          echo 'Een herstelcommit gepusht op stagingbranch. Netlify mag nu precies één build starten.'
