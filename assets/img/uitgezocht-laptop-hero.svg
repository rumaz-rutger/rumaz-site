<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Rumaz editorial laptop header</title>
  <desc id="desc">A refined editorial still life with laptop, notebook and calculator in RuMaZ colours.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f0e6"/>
      <stop offset="1" stop-color="#ebe2d3"/>
    </linearGradient>
    <linearGradient id="deskGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#13382e" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#082c22" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="laptopBody" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ddd8ce"/>
      <stop offset="1" stop-color="#bcb7ad"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071e17"/>
      <stop offset="1" stop-color="#123a2f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f0eadf"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="38" flood-color="#051a14" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#051a14" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
